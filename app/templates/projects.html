<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Matthew Prempeh</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Matthew Prempeh</div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/projects">Projects</a>
                <a href="/contact">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>My Projects</h1>
        <div class="projects-grid">
            {% for project in projects %}
            <div class="project-card">
                <img src="{{ url_for('static', filename='images/' + project.image) }}" alt="{{ project.title }}">
                <div class="project-info">
                    <h3>{{ project.title }}</h3>
                    <p>{{ project.description }}</p>
                    <p class="tech">{{ project.tech }}</p>
                    <a href="{{ project.link }}" class="btn">View Live</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Matthew Prempeh. All rights reserved.</p>
    </footer>
</body>
</html>
